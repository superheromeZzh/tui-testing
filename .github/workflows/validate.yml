name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y tmux shellcheck
      - name: Check shell syntax
        run: bash -n scripts/*.sh tests/*.sh
      - name: Run ShellCheck
        run: shellcheck scripts/*.sh tests/*.sh
      - name: Run smoke test
        run: bash tests/smoke_test.sh
